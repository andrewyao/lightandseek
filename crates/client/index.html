<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lightandseek</title>
    <link data-trunk rel="rust" data-bin="client" data-wasm-opt="0" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #10141a; color: #f3efe6; font: 14px system-ui, sans-serif; }
      .app { position: fixed; inset: 0; }
      .stage { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
      button { background: rgba(255, 255, 255, 0.08); color: inherit; border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
      button:hover:not(:disabled) { border-color: rgba(255, 255, 255, 0.7); }
      button.on { background: #f3efe6; color: #10141a; }
      button:disabled { opacity: 0.35; cursor: default; }
      input { background: rgba(0, 0, 0, 0.35); color: inherit; border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 6px; padding: 5px 8px; font: inherit; width: 140px; }
      .card { position: absolute; background: rgba(14, 18, 24, 0.9); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 18px 22px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4); }
      .center { left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; }
      .lobby { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(440px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow-y: auto; box-sizing: border-box; }
      h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: 0.02em; }
      h2 { margin: 14px 0 6px; font-size: 13px; text-transform: uppercase; opacity: 0.6; }
      .room { margin: 0 0 12px; opacity: 0.85; }
      .share { display: block; font-size: 12px; opacity: 0.6; word-break: break-all; }
      .row, .stepper { display: flex; align-items: center; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
      .label { width: 84px; opacity: 0.75; }
      .stepper output { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
      .roster { list-style: none; margin: 0; padding: 0; }
      .roster li { padding: 3px 0; }
      .start { margin-top: 10px; background: #e2483b; border-color: #e2483b; color: #fff; padding: 8px 22px; font-weight: 600; }
      .note { font-size: 12px; opacity: 0.65; margin: 6px 0 0; }
      .refused { color: #ff9b8f; margin: 8px 0 0; min-height: 1em; }
      .readonly { margin: 12px 0 0; }
      .hud { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px; background: rgba(14, 18, 24, 0.78); padding: 8px 16px; border-radius: 10px; white-space: nowrap; }
      .role { font-weight: 700; }
      .role.seeker { color: #ff6a5c; }
      .clock { font-variant-numeric: tabular-nums; font-weight: 600; }
      .watching { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); background: rgba(14, 18, 24, 0.7); padding: 5px 12px; border-radius: 8px; }
      .blind { position: absolute; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 36px; font-weight: 700; }
      .blind p { margin: 4px; }
      .blind .note { font-size: 14px; font-weight: 400; }
      .hud { z-index: 1; }
      .hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); margin: 0; font-size: 12px; opacity: 0.7; text-shadow: 0 1px 2px #000; }
      .toasts { position: absolute; top: 96px; left: 50%; transform: translateX(-50%); list-style: none; margin: 0; padding: 0; z-index: 2; }
      .toasts li { background: rgba(226, 72, 59, 0.92); color: #fff; padding: 6px 14px; border-radius: 8px; margin-bottom: 6px; text-align: center; }
      .status { position: absolute; right: 10px; bottom: 8px; font-size: 11px; opacity: 0.5; }
      .results h1 { font-size: 28px; }
    </style>
  </head>
  <body></body>
</html>
